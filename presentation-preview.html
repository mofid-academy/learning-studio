:root{color-scheme:light;--paper:#f4faf6;--surface:#fff;--soft:#eaf5ee;--ink:#164d3b;--muted:#567460;--line:#d7e8dd;--brand:#0f7c72;--brand-end:#3fb7aa;--on-brand:#fff;--shade:rgba(12,83,54,.08)}
*,:before,:after{box-sizing:border-box}html{min-height:100%;scroll-behavior:auto}body{margin:0;min-height:100svh;display:flex;flex-direction:column;direction:rtl;background:var(--paper);color:var(--ink);font:400 16px/1.85 &quot;Pinar VF&quot;,Pinar,Tahoma,sans-serif;-webkit-font-smoothing:antialiased}
body:not(.lesson-light){color-scheme:dark;--paper:#24342a;--surface:#2d4032;--soft:#354e3b;--ink:#e1ede2;--muted:#bbd0bd;--line:#526e57;--brand:#a0d0bb;--brand-end:#b5d7bf;--on-brand:#193e2c;--shade:rgba(0,0,0,.14)}
[hidden]{display:none!important}.aura,.stars,.hero-bg-animation,.orbital-scene{display:none!important}button,select,summary{font:inherit}button,select{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);min-height:40px;padding:7px 13px;line-height:1.6}button,summary{cursor:pointer}button:disabled{opacity:.42;cursor:default}button:hover:not(:disabled),select:hover{border-color:var(--brand)}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
.lesson-header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--surface)}.lesson-header strong{font-weight:800;font-size:16px}.lesson-header .actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.actions button{font-size:12px}.actions #teaching[aria-pressed=&quot;true&quot;]{background:var(--soft);border-color:var(--brand);color:var(--brand)}.teaching-wordmark{display:block;direction:ltr;text-align:right;font-size:11px;font-weight:750;letter-spacing:.08em;line-height:1.8;color:var(--muted)}
