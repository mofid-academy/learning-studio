<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>استودیوی یادگیری | مفید آکادمی</title>
<style>
html,body{height:100%;margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3faf8;color:#0f4f49}
body{display:grid;place-items:center}
.box{background:#fff;border:1px solid #dcece8;border-radius:20px;padding:28px 34px;box-shadow:0 20px 60px #0b4f4520;text-align:center;min-width:260px}
.spin{width:34px;height:34px;border:3px solid #d8eeea;border-top-color:#159b8e;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
small{display:block;margin-top:8px;opacity:.65}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><strong>در حال بارگذاری استودیوی یادگیری...</strong><small>لطفاً چند لحظه صبر کنید.</small></div>
<script>
(async()=>{
  const files=["chunks/v2-00.txt","chunks/v2-01.txt","chunks/v2-02.txt","chunks/v2-03.txt","chunks/v2-04.txt","chunks/v2-05.txt","chunks/v2-06.txt","chunks/v2-07.txt","chunks/v2-08.txt","chunks/v2-09.txt","chunks/v2-10.txt","chunks/v2-11.txt","chunks/v2-12.txt","chunks/v2-13.txt","chunks/v2-14.txt","chunks/v2-15.txt","chunks/v2-16.txt","chunks/v2-17.txt","chunks/v2-18.txt","chunks/v2-19.txt","chunks/v2-20.txt","chunks/v2-21.txt","chunks/v2-22.txt","chunks/v2-23.txt","chunks/v2-24.txt","chunks/v2-25.txt","chunks/v2-26.txt","chunks/v2-27.txt","chunks/v2-28.txt","chunks/v2-29.txt","chunks/v2-30.txt","chunks/v2-31.txt","chunks/v2-32.txt","chunks/v2-33.txt","chunks/v2-34.txt","chunks/v2-35.txt","chunks/v2-36.txt","chunks/v2-37.txt","chunks/v2-38.txt","chunks/v2-39.txt"];
  try{
    const html=(await Promise.all(files.map(async p=>{const r=await fetch(p+"?v=20261003-responses-5");if(!r.ok)throw new Error(p+" "+r.status);return r.text()}))).join("");
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="box"><strong>خطا در بارگذاری سایت</strong><small>'+String(e).replace(/[<>&]/g,"")+'</small></div>';
  }
})();
</script>
</body>
</html>
